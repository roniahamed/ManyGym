name: ManyGym CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI: Automated Tests & Code Quality
  # =========================================================================
  test:
    name: Automated Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manygym_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 libpq-dev ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: manygym_test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-secret-key-very-secure-12345
        run: |
          python manage.py check

      - name: Run Pytest Suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: manygym_test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-secret-key-very-secure-12345
        run: |
          pytest --maxfail=1

  # =========================================================================
  # 2. CD: Automated Deployment to Production VPS
  # =========================================================================
  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================================="
            echo "Starting ManyGym Automated Deployment..."
            echo "=========================================================="
            cd /root/ManyGym

            echo "Step 1: Pulling latest code from master branch..."
            git pull origin master

            echo "Step 2: Building updated Docker images..."
            docker compose build web celery_worker celery_beat

            echo "Step 3: Updating running Docker services..."
            docker compose up -d --remove-orphans

            echo "Step 4: Executing database migrations..."
            docker compose exec -T web python manage.py migrate --noinput

            echo "Step 5: Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput

            echo "Step 6: Verifying public API health check..."
            curl -f -s https://v0.manygym.com/api/v1/health/ || exit 1

            echo "=========================================================="
            echo "ManyGym Deployment Successful!"
            echo "=========================================================="

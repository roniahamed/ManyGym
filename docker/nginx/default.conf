upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name _ localhost v0.manygym.com;

    # Support high volume media uploads (videos up to 200MB)
    client_max_body_size 250M;

    # Gzip compression for API responses and static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets
    location /static/ {
        alias /app/static_collected/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # User uploaded media assets
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Web application reverse proxy
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }
}

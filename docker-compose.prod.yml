services:
  web:
    command: daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application
    env_file:
      - .env.prod

  celery_worker:
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod

  celery_beat:
    env_file:
      - .env.prod

  nginx:
    ports:
      - "80:80"
      - "443:443"

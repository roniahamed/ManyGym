services:
  web:
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 120
    env_file:
      - .env.prod

  celery_worker:
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod

  celery_beat:
    env_file:
      - .env.prod

  nginx:
    ports:
      - "80:80"
      - "443:443"
